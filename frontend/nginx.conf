# The web app in Docker: the built Vue app, with every unknown path falling back to index.html (the router's own
# routes), and /api proxied to the review API (the compose service "api").
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are the request body itself; the API refuses anything over 30 MB with its own message, so nginx must let
    # that much through rather than answer 413 first.
    # The app limit is 30 MB and nginx must stay above it, so the app answers with its own JSON message.
    client_max_body_size 64m;

    # Docker's own DNS. Resolving "api" per request (a variable in proxy_pass) means nginx starts without the API and
    # follows it when the api container restarts with another address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;  # no URI part: the request's own path, /api/... included, is passed on unchanged
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The run view's live stream (EventSource on /api/runs/{id}/events): no buffering, and a read timeout well past
        # the stream's 15-second keepalive and a long draft.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        # Vite puts a content hash in every file name here, so a file never changes.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
