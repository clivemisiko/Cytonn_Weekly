# Development override: source folders are mounted into the containers and both servers
# reload on change. Updated 2026-10-23 for the nginx web image; not yet run.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Ports stay on 127.0.0.1 (set in docker-compose.yml) and the api uses the same database and
# bind-mounted data folder. File events do not cross the Windows mount, so both servers poll.

services:
  api:
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/api:/app/api:ro
      - ./backend/scripts:/app/scripts:ro
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
      - --reload-dir
      - /app/api
      - --reload-dir
      - /app/scripts

  web:
    build:
      target: dev
    environment:
      VITE_USE_POLLING: "true"
      # Vite's dev server proxies /api itself (nginx is not in this image).
      VITE_API_TARGET: http://api:8000
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      # Anonymous volume: the container keeps its own node_modules.
      - /app/node_modules
