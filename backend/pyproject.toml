[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cytonn-weekly"
version = "0.1.0"
description = "Automation for drafting, checking and publishing the Cytonn weekly report."
requires-python = ">=3.10"
dependencies = [
    "playwright==1.49.1",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pdfplumber==0.11.4",
    "anthropic==1.9.0",
    "apscheduler==3.11.0",
    "yfinance==1.7.0",
    "python-dotenv==1.2.3",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]  # installed in the Docker image so the suite runs there

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cytonn_weekly = ["schema.sql"]  # the database schema, read by sections.init_db()

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # api/ lives in backend/ beside src/, outside the installed package
