[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cytonn-weekly"
version = "0.1.0"
description = "Automation for drafting, checking and publishing the Cytonn weekly report."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright==1.49.1",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pdfplumber==0.11.4",
    "streamlit==1.41.1",
    "anthropic==1.9.0",
    "apscheduler==3.11.0",
    "yfinance==1.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
