# Cytonn Weekly: the review API (api) and the web app (web).
#
# SECURITY: this app has no sign-in. Both ports are published on 127.0.0.1 only, so the
# app is reachable from this machine and nowhere else. Never publish them on 0.0.0.0 or
# put them behind anything that another machine can reach, until a sign-in exists.
#
# The same ports as a native run (8000 and 5173), so bookmarks do not change: run either the
# Docker copy or the native one, never both at once.
#
# Secrets, the database URL and the provider switches come from the repo-root .env only, at run
# time (env_file). Nothing secret is written here or built into an image. Never run
# `docker compose config` without --quiet or --no-env-resolution: it prints what .env holds.
#
#   docker compose up -d --build     start both
#   docker compose down              stop both

services:
  api:
    build:
      context: ./backend
      target: runtime
    env_file:
      - ./.env
    environment:
      CYTONN_DATA_DIR: /app/data
      # The data folder below is the real backend/data, so the app must never fall back to
      # SQLite there: without CYTONN_DATABASE_URL in .env it refuses to start (db.py).
      CYTONN_REQUIRE_POSTGRES: "1"
      # The local development model (Ollama) runs on the host. Inside the container
      # "localhost" is the container itself, so the host is reached by this name.
      CYTONN_OLLAMA_URL: http://host.docker.internal:11434
      # Development-only speed settings for the local model (see .env.example). Each is
      # passed as an empty string when it is not set, and the code reads empty as not set.
      CYTONN_LOCAL_MAX_SEARCH_RESULTS: ${CYTONN_LOCAL_MAX_SEARCH_RESULTS:-}
      CYTONN_LOCAL_RESULT_CHARS: ${CYTONN_LOCAL_RESULT_CHARS:-}
      CYTONN_LOCAL_NUM_THREAD: ${CYTONN_LOCAL_NUM_THREAD:-}
      CYTONN_LOCAL_NUM_PREDICT: ${CYTONN_LOCAL_NUM_PREDICT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The same files the native app uses (inputs, charts, exports, the search cache), not a copy.
      - ./backend/data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      target: runner
    ports:
      # vite preview listens on 3000 in the runner stage (the dev override's dev stage uses 8080).
      - "127.0.0.1:5173:3000"
    environment:
      # vite preview proxies /api; inside the container 127.0.0.1 is the container itself, so name the api service.
      VITE_API_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
